# 把 docs/home-page/public（官网：主页与隐私政策，中英文）发布到 GitHub Pages：https://limuhua.github.io/SideNotes/
# Google 的 OAuth 同意屏幕要发布为正式版，品牌页填的主页与隐私政策就在这个站上（技术决策第 68、71 条），这两个地址不能变。
# 推送 claude（开发分支）或 master 且改到网站时发布；拉取请求只检查不发布；也可以在 Actions 页手动运行。
name: 发布网站

on:
  push:
    branches: [claude, master]
    paths:
      - 'docs/home-page/public/**'
      - 'docs/home-page/tools/check.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/home-page/public/**'
      - 'docs/home-page/tools/check.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 默认只读；发布作业单独申请写 Pages 与签发身份令牌的权限。
permissions:
  contents: read

jobs:
  # 打包与发布分成两个作业：同一个作业里上传后立刻发布，偶尔读不到刚上传的包（Found 0 artifact(s)）。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/home-page
      # 检查 Google 品牌验证依赖的内容（验证标记、应用名、隐私政策链接、Google 用户数据的说明）与本地引用，不通过就不发布。
      - name: 检查网站
        run: node docs/home-page/tools/check.mjs
      # 网站不跟应用的版本号走，用构建来认：把这次运行的编号、提交与构建时间写进 site.js 的占位，
      # 访客打开浏览器的控制台就看得到线上是哪一次构建（site.js 第 5 段）。找不到占位就失败，免得悄悄少了这一行。
      - name: 写入构建信息
        if: github.event_name != 'pull_request'
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          file=docs/home-page/public/assets/site.js
          grep -q "__SITE_BUILD__" "$file" || { echo "::error::site.js 里找不到构建信息的占位"; exit 1; }
          sed -i "s/__SITE_BUILD__/${RUN}/; s/__SITE_COMMIT__/${SHA:0:7}/; s/__SITE_BUILT_AT__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" "$file"
          grep -n "const build = " "$file"
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/home-page/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # 同一时间只发布一次，新的推送排队等前一次发布完，不中途取消。
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
