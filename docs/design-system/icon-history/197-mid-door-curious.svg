<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 197 门缝 · 好奇（居中，基于 177）：从门缝探出来，抬眼看暗处的一点灵光。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36419a"/><stop offset="1" stop-color="#171c4c"/></linearGradient>
    <radialGradient id="spill" cx="50" cy="30" r="26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe08a" stop-opacity=".22"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="50" y1="50" x2="22" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe08a" stop-opacity=".55"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></linearGradient>
    <linearGradient id="note" x1="9" y1="0" x2="-17" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff6c0"/><stop offset=".25" stop-color="#ffdc63"/><stop offset="1" stop-color="#e3a032"/></linearGradient>
    <linearGradient id="fold" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc9a"/><stop offset="1" stop-color="#c98a26"/></linearGradient>
    <linearGradient id="rimL" x1="9" y1="0" x2="-6" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-300%" y="-50%" width="700%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="halo" x="-300%" y="-20%" width="700%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="spark" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blush" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".6"/></filter>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="room"><rect width="51.4" height="64"/></clipPath>
    <filter id="spk2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation=".9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#spill)"/>
    <path d="M48.6 50H51.4L44 64H12Z" fill="url(#beam)"/>
    <rect x="48.6" y="9" width="2.8" height="41" fill="#ffeab2" filter="url(#halo)"/>
    <rect x="48.6" y="9" width="2.8" height="41" rx="1" fill="#ffeab2" filter="url(#glow)"/>
    <g filter="url(#spk2)" fill="#ffe680" opacity=".92"><path d="M19 10.8C19.4 13.5 20.5 14.6 23.2 15C20.5 15.4 19.4 16.5 19 19.2C18.6 16.5 17.5 15.4 14.8 15C17.5 14.6 18.6 13.5 19 10.8Z"/><circle cx="25.2" cy="11" r=".8"/></g>
