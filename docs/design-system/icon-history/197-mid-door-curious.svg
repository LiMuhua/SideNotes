        <g transform="translate(-3.5 .5) scale(.85)">
          <path d="M-13.5 -17H13.5A3.5 3.5 0 0 1 17 -13.5V13.5A3.5 3.5 0 0 1 13.5 17H-10L-17 10V-13.5A3.5 3.5 0 0 1 -13.5 -17z" fill="url(#note)"/>
          <path d="M-17 10L-10 17V10z" fill="url(#fold)"/>
          <path d="M-13.5 -17H13.5A3.5 3.5 0 0 1 17 -13.5V13.5A3.5 3.5 0 0 1 13.5 17H-10" fill="none" stroke="url(#rimL)" stroke-width="1"/>
          <g fill="#2b1d06"><ellipse cx="-10" cy="-4.2" rx="2.5" ry="3.3"/><ellipse cx="-1.6" cy="-4.2" rx="2.5" ry="3.3"/></g><g fill="#fff"><circle cx="-10.8" cy="-5.800000000000001" r="0.9"/><circle cx="-2.4" cy="-5.800000000000001" r="0.9"/></g><path d="M-3.9 -9.8Q-1.6 -11 .7 -10" fill="none" stroke="#2b1d06" stroke-width=".9" stroke-linecap="round"/>
