<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 163 门缝便签（15 + 00）：门缝里递出一张便签，只在那一线光里露面——不开灯，不敲门，也不打扰。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2521"/><stop offset="1" stop-color="#16110e"/></linearGradient>
    <linearGradient id="beam" x1="50" y1="50" x2="22" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd590" stop-opacity=".8"/><stop offset="1" stop-color="#ffd590" stop-opacity="0"/></linearGradient>
    <linearGradient id="note" x1="49" y1="0" x2="27" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff2a6"/><stop offset=".35" stop-color="#ffd85c"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
    <radialGradient id="spill" cx="49" cy="30" r="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd590" stop-opacity=".35"/><stop offset="1" stop-color="#ffd590" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-300%" y="-20%" width="700%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="room"><rect width="48.6" height="64"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#spill)"/>
    <path d="M48.6 50H51.4L44 64H12Z" fill="url(#beam)"/>
    <g clip-path="url(#room)">
      <g transform="translate(46 31) rotate(-9)">
        <rect x="-18" y="-11" width="28" height="28" rx="3" fill="#000" opacity=".45" filter="url(#soft)" transform="translate(-2.5 3)"/>
        <rect x="-18" y="-14" width="29" height="29" rx="3.4" fill="url(#note)"/>
        <path d="M-14.6 -14H11" stroke="#fff6d2" stroke-opacity=".8" stroke-width=".8"/>
        <g fill="#2b1d06"><ellipse cx="-7.5" cy="-3" rx="2.4" ry="3.1"/><ellipse cx="-.6" cy="-3" rx="2.4" ry="3.1"/></g>
        <g fill="#fff"><circle cx="-8.4" cy="-4.2" r=".9"/><circle cx="-1.5" cy="-4.2" r=".9"/></g>
      </g>
    </g>
    <rect x="48.6" y="9" width="2.8" height="41" rx="1" fill="#ffe2a8" filter="url(#glow)"/>
  </g>
</svg>
