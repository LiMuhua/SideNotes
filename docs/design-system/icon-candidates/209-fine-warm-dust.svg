    <radialGradient id="spill" cx="50" cy="30" r="26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd590" stop-opacity=".2"/><stop offset="1" stop-color="#ffd590" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="50" y1="50" x2="22" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd590" stop-opacity=".8"/><stop offset="1" stop-color="#ffd590" stop-opacity="0"/></linearGradient>
    <linearGradient id="note" x1="9" y1="0" x2="-17" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff5c2"/><stop offset=".3" stop-color="#ffdb66"/><stop offset="1" stop-color="#eeac3c"/></linearGradient>
    <linearGradient id="fold" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efd393"/><stop offset="1" stop-color="#bf7f22"/></linearGradient>
