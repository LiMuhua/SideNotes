<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 181 探头 · 竖线眼（克制，基于 00）：眼睛换成两道竖线，更利落。 -->
  <defs>
    <linearGradient id="sn-icon-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4150b0" />
      <stop offset="1" stop-color="#232c6c" />
    </linearGradient>
    <linearGradient id="sn-icon-note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe36e" />
      <stop offset="1" stop-color="#ffc53a" />
    </linearGradient>
    <linearGradient id="sn-icon-fold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d6" />
      <stop offset="1" stop-color="#f1c24a" />
    </linearGradient>
    <clipPath id="sn-icon-clip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>
  <!-- 屏幕与屏幕上的三行内容，长短沿用现有品牌标记三根竖条的比例 -->
  <rect width="64" height="64" rx="14" fill="url(#sn-icon-screen)" />
  <g fill="#fff" opacity=".16">
    <rect x="9" y="20" width="11" height="3.6" rx="1.8" />
    <rect x="9" y="28.5" width="20" height="3.6" rx="1.8" />
    <rect x="9" y="37" width="15" height="3.6" rx="1.8" />
  </g>
  <!-- 便签：从右边缘斜着探进来，屏幕之外的部分裁掉；左下角折起一角 -->
  <g clip-path="url(#sn-icon-clip)">
    <g transform="translate(56 37) rotate(-15)">
      <path d="M-15.5 -15H18.5V19H-8.5L-15.5 12z" fill="#000" opacity=".3" />
      <path d="M-13.5 -17H13.5A3.5 3.5 0 0 1 17 -13.5V13.5A3.5 3.5 0 0 1 13.5 17H-10L-17 10V-13.5A3.5 3.5 0 0 1 -13.5 -17z" fill="url(#sn-icon-note)" />
      <path d="M-17 10L-10 17V10z" fill="url(#sn-icon-fold)" />
      <g fill="#2b1d06"><rect x="-10.95" y="-6.2" width="1.9" height="5.6" rx=".95"/><rect x="-2.55" y="-6.2" width="1.9" height="5.6" rx=".95"/></g>
    </g>
  </g>
</svg>
