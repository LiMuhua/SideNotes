          <path d="M-13.5 -17H13.5A3.5 3.5 0 0 1 17 -13.5V13.5A3.5 3.5 0 0 1 13.5 17H-10L-17 10V-13.5A3.5 3.5 0 0 1 -13.5 -17z" fill="url(#note)"/>
          <path d="M-17 10L-10 17V10z" fill="url(#fold)"/>
          <path d="M-13.5 -17H13.5A3.5 3.5 0 0 1 17 -13.5V13.5A3.5 3.5 0 0 1 13.5 17H-10" fill="none" stroke="url(#rimL)" stroke-width="1"/>
          <g fill="#ff8f5e" opacity=".5" filter="url(#blush)"><ellipse cx="-12.8" cy="2.6" rx="2.3" ry="1.3"/><ellipse cx="0.6" cy="2.6" rx="2.3" ry="1.3"/></g>
          <g fill="#2b1d06"><ellipse cx="-10" cy="-4.5" rx="3.1" ry="4"/><ellipse cx="-1.2" cy="-4.5" rx="3.1" ry="4"/></g>
          <g fill="#fff"><circle cx="-11.2" cy="-6.6" r="1.25"/><circle cx="-2.4" cy="-6.6" r="1.25"/><circle cx="-9" cy="-2.6" r=".5"/><circle cx="-.2" cy="-2.6" r=".5"/></g>
          <ellipse cx="-5.6" cy="3.8" rx="1.5" ry="1.8" fill="#2b1d06"/>
