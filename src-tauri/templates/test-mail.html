<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SideNotes 通知：测试邮件</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            border-top: 4px solid #0078D4;
        }
        h2 {
            color: #333333;
            margin-top: 0;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 10px;
        }
        .content {
            font-size: 15px;
            line-height: 1.6;
            color: #555555;
        }
        .status-list {
            background-color: #f9f9f9;
            padding: 15px 20px;
            border-radius: 4px;
            border-left: 4px solid #28a745;
        }
        .status-ok {
            color: #28a745;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px dashed #dddddd;
            font-size: 12px;
            color: #999999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔔 SideNotes 通知：测试邮件</h2>

        <div class="content">
            <p>您好，</p>
            <p>这是电脑 <strong>{{computer}}</strong> 上的 SideNotes 在 {{send_time}} 发出的测试邮件。</p>
            <p>能在邮件客户端里正常看到这封邮件的排版与颜色，说明：</p>

            <div class="status-list">
                <ul style="margin: 0; padding-left: 20px;">
                    <li>Resend 密钥：<span class="status-ok">有效</span></li>
                    <li>发件地址：<span class="status-ok">{{from}}</span></li>
                    <li>HTML 渲染：<span class="status-ok">正常</span></li>
                </ul>
            </div>

            <p>云端同步失败时，SideNotes 会给这个邮箱发通知。</p>
        </div>

        <div class="footer">
            此为 SideNotes 自动发送的邮件，请勿直接回复。
        </div>
    </div>
</body>
</html>
