[package]
name = "sidenotes"
version = "0.8.2"
description = "SideNotes 本地快速记录工具"
authors = ["LiMuhua"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 的桌面与移动端共用库入口。
name = "sidenotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 构建脚本读 oauth-clients.json（见 build.rs）。
serde_json = "1"

[dependencies]
# devtools：正式版也能从设置页打开开发者工具，便于排查问题。
# protocol-asset：卡片中显示应用数据目录里的图片副本（见 tauri.conf.json 的 assetProtocol）。
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# 解析软链接与目录联接后去掉 Windows 路径的 \\?\ 前缀（Tauri 已依赖同一版本）。
dunce = "1"
# 大图的显示副本（T115）：读 PNG、JPEG 的尺寸，缩小后另存（Tauri 已依赖同一版本，这里加上 JPEG 的编解码）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# 云端同步（T159 起）：WebDAV、OneDrive、Google Drive 与 Resend 的 HTTP 请求，在后台线程里同步发出。
# TLS 用系统自带的（Windows 上是 SChannel），不用默认的 rustls + aws-lc：后者在 Windows 上编译要装 cmake 与 NASM。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "query", "native-tls"] }
# WebDAV 的 PROPFIND 回复是 XML（Tauri 已依赖同一版本）。
quick-xml = "0.42"
# OAuth 的 PKCE 校验码与邮件的幂等键（Tauri 已依赖同一版本）。
sha2 = "0.10"
getrandom = "0.3"
# 自动备份按 crontab 的五段写法算本地时间的下一次（Tauri 已依赖同一版本）。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 云端路径逐段编码进网址。
percent-encoding = "2"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# 与 Tauri 使用的版本一致，直接调用 DWM、窗口定位、DirectWrite（列出系统字体）、低级键盘钩子（录入快捷键）、
# 全屏判断（显示器、用户通知状态）、快捷方式（COM 的 IShellLinkW，应用图标改快捷方式的图标）与本地时间（诊断日志）API。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  # 云端同步的凭据（密码、登录令牌、Resend 密钥）用 DPAPI 加密后存在本机（cloud::secrets）。
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  # 托盘菜单的图标按系统的应用明暗配色（menu_icons::system_dark，读注册表）。
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # 磨砂玻璃的实时模糊（T118）：侧栏窗口上挂合成树，用宿主背景画刷画背后的画面；
  # 再叠一层高斯模糊与饱和度（T124，合成器的效果，按 Direct2D 效果的编号与参数描述）。
  "Foundation",
  "Graphics_Effects",
  "System",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_System_WinRT_Graphics_Direct2D",
] }
# 合成接口的向量参数（与 windows 0.62 用的同一版本）。
windows-numerics = "0.3"
# 交给合成器的效果要实现 WinRT 接口（#[implement]，与 windows 0.62 用的同一版本）。
windows-core = "0.62"

[profile.release]
# 发布包优先体积与启动速度。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
