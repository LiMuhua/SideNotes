<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SideNotes 应用图标候选</title>
<style>
  body { margin: 0; padding: 32px 36px 64px; background: #ebecef; color: #1d2025; font: 14px/1.65 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  .lead { max-width: 72em; margin: 0 0 6px; color: #555b64; }
  .pick { margin: 0 0 20px; color: #3a3f47; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding: 8px 14px; overflow-x: auto; border-radius: 10px; }
  .bar.light { background: #f3f3f3; }
  .bar.dark { background: #1f1f1f; color: #ccc; }
  .bar .label { flex: none; width: 92px; font-size: 12px; opacity: .65; }
  .bar img { flex: none; }
  .bar .sep { flex: none; width: 1px; height: 20px; margin: 0 6px; background: currentColor; opacity: .25; }
  h2 { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 2px; font-size: 18px; }
  .note { max-width: 72em; margin: 0 0 14px; color: #5b616b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(296px, 1fr)); gap: 18px; }
  .card { display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .05); }
  .card.base { background: #f7f7f9; box-shadow: inset 0 0 0 1px #d9dce2; }
  .hero { display: flex; justify-content: center; padding: 22px 0 18px; background: linear-gradient(#f5f6f8, #e4e7eb); }
  .base .hero { background: none; }
  .hero img { filter: drop-shadow(0 6px 14px rgb(0 0 0 / .18)); }
  .meta { display: flex; align-items: baseline; gap: 8px; margin: 14px 18px 2px; }
  .meta .n { color: #8a8f98; font-variant-numeric: tabular-nums; }
  .meta h3 { margin: 0; font-size: 17px; }
  .meta .tag { margin-left: auto; padding: 0 8px; border-radius: 99px; background: #eef0f3; color: #646a73; font-size: 12px; white-space: nowrap; }
  .base .meta .tag { background: #e2e5ea; }
  .idea { flex: 1; margin: 2px 18px 12px; color: #3f444c; }
  .small { display: flex; }
  .small > div { display: flex; flex: 1; align-items: center; justify-content: center; gap: 14px; padding: 10px 0; }
  .small .l { background: #f3f3f3; }
  .small .d { background: #1f1f1f; }
  /* 16px 实际像素放大 4 倍：高分屏上画出来的 16px 比真实托盘清楚，这里还原 100% 缩放时的样子 */
  canvas.px { width: 64px; height: 64px; image-rendering: pixelated; }
  details { max-width: 72em; margin-top: 8px; color: #4a4f57; }
  summary { cursor: pointer; color: #1d2025; font-weight: 600; }
  details ul { margin: 8px 0 0; padding-left: 1.2em; }
  details li { margin: 2px 0; }
</style>
</head>
<body>
<h1>SideNotes 应用图标 · 在 00、10、15、21 上深化（163–172）</h1>
<p class="lead">按你的意思回到 00、10、15、21 四个原稿，用点缀、变体与结合三种做法往下走，画风保持原稿的简洁。每组先放原稿，后面是在它基础上的新版；结合了别的原稿会在标签里注明。每张卡片有 256px 主图，以及浅色、深色背景上的 32px 和 16px 实际像素（放大 4 倍）预览。顶部四条是任务栏与托盘尺寸的横向对照。</p>
<p class="pick">我的推荐：<b>163 门缝便签</b>、<b>168 一叠探头</b>、<b>171 叠纸里的小家伙</b>。</p>
<div id="bars"></div>
<main id="groups"></main>
<h2>试过但没留下</h2>
<details id="dropped"><summary>几版草稿与放弃的原因</summary><ul></ul></details>
<script>
  // 候选清单：新增或删除只改这里，页面按清单生成。每组的 base 是原稿，items 是在它基础上的新版。
  const GROUPS = [
    {
      title: '15 门缝的光',
      change: '你的评价是第二批里最中意、但太单调。这一组给那一线光加上故事：门缝里递出一张便签，或者照亮便签的一半。',
      base: { n: '15', file: '15-door-light.svg', name: '门缝的光', tag: '原稿', idea: '暗处的一线门缝光，地上拖出一道光。' },
      items: [
        { n: '163', file: '163-door-note.svg', name: '门缝便签', tag: '结合 00', idea: '门缝里递出一张便签，只在那一线光里露面——不开灯，不敲门，也不打扰。' },
        { n: '164', file: '164-door-note-indigo.svg', name: '门缝便签 · 靛蓝', tag: '163 的变体', idea: '同一个场景换成现用图标的靛蓝与黄，和 00 一脉相承。' },
        { n: '165', file: '165-door-half-moon.svg', name: '门缝半月', tag: '结合 21', idea: '门缝那一线光刚好照亮便签的一半，另一半安静地留在暗处。' },
      ],
    },
    {
      title: '00 探头的便签',
      change: '现用图标。保留探头的姿势，做细修、加一点灵光，或者和其他原稿结合。',
      base: { n: '00', file: '00.svg', name: '探头的便签', tag: '原稿 · 现用', idea: '黄色便签从靛蓝色屏幕的右边缘探出头来，看着屏幕上的内容。' },
      items: [
        { n: '166', file: '166-peek-refined.svg', name: '探头 · 精修', tag: '点缀', idea: '屏幕加一层光泽，便签加腮红与眼里的第二个高光，更有精神。' },
        { n: '167', file: '167-peek-spark.svg', name: '探头 · 灵光', tag: '点缀', idea: '灵感一闪，便签马上探出头来看：眼睛往上看，嘴巴微张。' },
        { n: '168', file: '168-peek-stack.svg', name: '一叠探头', tag: '结合 10', idea: '不止一张：一叠便签从屏幕边上探出来，最前面那张看着你。' },
        { n: '169', file: '169-peek-day.svg', name: '白天探头', tag: '结合 21 的变体', idea: '探头的便签搬到白天的天空里，去掉夜色，更轻快。' },
      ],
    },
    {
      title: '21 月相便签',
      change: '你的评价是不错，但像哄睡读物相关的应用。这一组把它挂到白天的天空里。',
      base: { n: '21', file: '21-note-moon.svg', name: '月相便签', tag: '原稿', idea: '夜空里一张便签只亮着一弯边，像一轮月相。' },
      items: [
        { n: '170', file: '170-day-moon.svg', name: '白昼月相', tag: '变体', idea: '白天也看得见的月亮：便签挂在晴空里，飘过一朵云，没有哄睡的味道。' },
      ],
    },
    {
      title: '10 叠纸',
      change: '你的评价是还行，但更像普通笔记，没有体现不打断心流。这一组给叠纸加上性格和动势。',
      base: { n: '10', file: '10-paper-fan.svg', name: '叠纸', tag: '原稿', idea: '三张便签从右下角展开成扇形，最前面那张写着字。' },
      items: [
        { n: '171', file: '171-fan-peek.svg', name: '叠纸里的小家伙', tag: '结合 00', idea: '叠起来的便签后面，有个小家伙探出眼睛，看你刚记下什么。' },
        { n: '172', file: '172-fan-swish.svg', name: '叠纸 · 一掠', tag: '点缀', idea: '最前面那张便签留下两道残影，像是唰地一下落到手边。' },
      ],
    },
  ];
  const DROPPED = [
    '门缝照月相（细月牙）：缩小后月牙和门缝是两道竖光，像暂停键，改成了 165 的半月。',
    '门底塞纸条：画了门、门下的光和塞进来的纸条，整体像舞台或电梯，认不出纸条。',
    '叠纸月相：后面两张只亮一道边，暗的部分和底色融在一起。',
    '叠纸动势线：几道弧线像划痕，改成了 172 的残影。',
    '白天探头（白便签）：白色方块加两只眼睛像小幽灵，改成了 169 的黄便签。',
  ];

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const img = (file, size, alt = '') => `<img src="${file}" width="${size}" height="${size}" alt="${esc(alt)}">`;

  function bar(tone, size, label) {
    const groups = GROUPS.map((g) => [g.base, ...g.items].map((it) => img(it.file, size, it.n)).join(''));
    return `<div class="bar ${tone}"><span class="label">${label}</span>${groups.join('<span class="sep"></span>')}</div>`;
  }

  function small(file) {
    const panel = (tone) => `<div class="${tone}">${img(file, 32)}<canvas class="px" width="16" height="16" data-src="${file}" title="16px 实际像素，放大 4 倍"></canvas></div>`;
    return `<div class="small">${panel('l')}${panel('d')}</div>`;
  }

  function card(it, isBase) {
    return `<article class="card${isBase ? ' base' : ''}" id="v${it.n}">
      <div class="hero">${img(it.file, 256, `第 ${it.n} 版：${it.name}`)}</div>
      <div class="meta"><span class="n">${it.n}</span><h3>${esc(it.name)}</h3><span class="tag">${esc(it.tag)}</span></div>
      <p class="idea">${esc(it.idea)}</p>
      ${small(it.file)}
    </article>`;
  }

  document.getElementById('bars').innerHTML =
    bar('light', 32, '任务栏 32px') + bar('dark', 32, '任务栏 32px') + bar('light', 16, '托盘 16px') + bar('dark', 16, '托盘 16px');
  document.getElementById('groups').innerHTML = GROUPS.map((g) => `<section>
      <h2>${esc(g.title)}</h2>
      <p class="note">${esc(g.change)}</p>
      <div class="grid">${card(g.base, true)}${g.items.map((it) => card(it, false)).join('')}</div>
    </section>`).join('');
  document.querySelector('#dropped ul').innerHTML = DROPPED.map((s) => `<li>${esc(s)}</li>`).join('');

  // 把 SVG 直接栅格化成 16×16：给根元素补上宽高，避免没有固有尺寸的 SVG 被按 300×150 拉伸。
  const rasters = new Map();
  function raster(file) {
    if (!rasters.has(file)) {
      rasters.set(file, fetch(file)
        .then((r) => r.text())
        .then((text) => new Promise((resolve, reject) => {
          const url = URL.createObjectURL(new Blob([text.replace('<svg ', '<svg width="16" height="16" ')], { type: 'image/svg+xml' }));
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = url;
        })));
    }
    return rasters.get(file);
  }
  for (const canvas of document.querySelectorAll('canvas.px')) {
    raster(canvas.dataset.src).then((image) => canvas.getContext('2d').drawImage(image, 0, 0, 16, 16)).catch(() => canvas.remove());
  }
</script>
</body>
</html>
