<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 158 侧窗：不用离座，往侧窗一瞥就是整片天；遮光板拉下，它就安静退场。 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eee5"/>
      <stop offset="1" stop-color="#d8cdbe"/>
    </linearGradient>
    <radialGradient id="spill" cx="160" cy="132" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbc1b2"/>
      <stop offset=".5" stop-color="#ece6dc"/>
      <stop offset="1" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4aa8"/>
      <stop offset=".42" stop-color="#4f93dc"/>
      <stop offset=".7" stop-color="#bfe0f4"/>
      <stop offset=".84" stop-color="#ffe1bd"/>
      <stop offset="1" stop-color="#ffc99c"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ebe1"/>
      <stop offset="1" stop-color="#ddd3c4"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c4d2"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".32" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
    <filter id="b6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
    <clipPath id="pane"><rect x="114" y="46" width="98" height="166" rx="49"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#wall)"/>
    <rect width="256" height="256" fill="url(#spill)"/>
    <rect x="94" y="24" width="138" height="210" rx="69" fill="#8f8473" fill-opacity=".4" filter="url(#b6)" transform="translate(-4 -5)"/>
    <rect x="94" y="24" width="138" height="210" rx="69" fill="url(#bezel)"/>
    <rect x="108" y="40" width="110" height="178" rx="55" fill="#b3a998"/>
    <g clip-path="url(#pane)">
      <rect x="110" y="42" width="106" height="174" fill="url(#sky)"/>
      <path d="M110 178C122 168 134 174 144 168C156 160 170 168 182 162C194 156 206 164 216 160V216H110Z" fill="#fffaf2"/>
      <path d="M110 192C126 186 142 190 158 185C176 180 196 186 216 182V216H110Z" fill="#f6e4d0"/>
      <path d="M104 198L190 174L200 152L206 153L200 177L104 210Z" fill="url(#wing)"/>
      <circle cx="203.5" cy="154.5" r="2" fill="#ff4d4d"/>
      <rect x="110" y="42" width="106" height="52" fill="url(#shade)"/>
      <rect x="110" y="92" width="106" height="3" fill="#c8bdac"/>
      <rect x="110" y="95" width="106" height="6" fill="#0b1830" fill-opacity=".22" filter="url(#b2)"/>
      <rect x="153" y="86" width="20" height="4.5" rx="2.25" fill="#bdb1a0"/>
      <rect x="110" y="42" width="106" height="174" fill="url(#glare)"/>
    </g>
    <rect x="114" y="46" width="98" height="166" rx="49" fill="none" stroke="#6f6658" stroke-opacity=".38" stroke-width="3"/>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
