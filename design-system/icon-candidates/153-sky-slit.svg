<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 153 一线天：两面峭壁之间漏下一线天光，一只燕子正从缝里穿过。 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f2"/>
      <stop offset=".42" stop-color="#fbe8cb"/>
      <stop offset=".78" stop-color="#ffc898"/>
      <stop offset="1" stop-color="#ffa973"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b160f"/>
      <stop offset=".45" stop-color="#7f331e"/>
      <stop offset=".82" stop-color="#cc6738"/>
      <stop offset="1" stop-color="#f7a76b"/>
    </linearGradient>
    <linearGradient id="wallR" x1="256" y1="0" x2="163" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#461b12"/>
      <stop offset=".6" stop-color="#a14628"/>
      <stop offset="1" stop-color="#f19a5f"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd7ad" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0703" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
    <path id="eL" d="M150 -10C147 12 144 24 146 40S157 72 156 92S148 122 150 140S161 172 160 190S158 240 158 266"/>
    <path id="eR" d="M184 -10C178 12 174 24 174 40S173 72 172 92S165 122 166 140S169 172 168 190S163 240 163 266"/>
    <path id="wL" d="M-10 -10H150C147 12 144 24 146 40S157 72 156 92S148 122 150 140S161 172 160 190S158 240 158 266H-10Z"/>
    <path id="wR" d="M266 -10H184C178 12 174 24 174 40S173 72 172 92S165 122 166 140S169 172 168 190S163 240 163 266H266Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <use href="#wL" fill="url(#wallL)"/>
    <use href="#wR" fill="url(#wallR)"/>
    <g fill="none">
      <use href="#eL" transform="translate(-15 0)" stroke="#ffc08b" stroke-opacity=".32" stroke-width="5"/>
      <use href="#eL" transform="translate(-35 5)" stroke="#62240f" stroke-opacity=".35" stroke-width="11"/>
      <use href="#eL" transform="translate(-61 -3)" stroke="#e58c56" stroke-opacity=".3" stroke-width="6"/>
      <use href="#eL" transform="translate(-92 6)" stroke="#4a1a0e" stroke-opacity=".38" stroke-width="17"/>
      <use href="#eL" transform="translate(-128 -4)" stroke="#a54d2c" stroke-opacity=".3" stroke-width="9"/>
      <use href="#eR" transform="translate(13 0)" stroke="#ffb57e" stroke-opacity=".32" stroke-width="4"/>
      <use href="#eR" transform="translate(33 5)" stroke="#55200f" stroke-opacity=".38" stroke-width="11"/>
      <use href="#eR" transform="translate(62 -3)" stroke="#d27846" stroke-opacity=".26" stroke-width="7"/>
