<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 156 月洞门：园林的月洞门开在墙的一侧，一步就走进另一处安静天地。 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset="1" stop-color="#e3ded4"/>
    </linearGradient>
    <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f4dd"/>
      <stop offset=".6" stop-color="#b6dcb1"/>
      <stop offset="1" stop-color="#8dc293"/>
    </linearGradient>
    <linearGradient id="bam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7f45"/>
      <stop offset=".45" stop-color="#6fae66"/>
      <stop offset="1" stop-color="#3a7440"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bbb3a6"/>
      <stop offset="1" stop-color="#ddd7cc"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="8"/>
      <feColorMatrix values="0 0 0 0 .4  0 0 0 0 .38  0 0 0 0 .33  0 0 0 .08 0"/>
    </filter>
    <filter id="b4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
    <clipPath id="gate"><circle cx="226" cy="132" r="96"/></clipPath>
    <g id="leaves">
      <path d="M150 58C134 46 116 42 98 44C114 52 132 56 150 58Z"/>
      <path d="M150 58C140 40 126 30 110 26C122 38 136 48 150 58Z"/>
      <path d="M150 58C134 60 118 68 106 80C122 74 136 66 150 58Z"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#wall)"/>
    <rect width="256" height="256" filter="url(#grain)"/>
    <use href="#leaves" transform="translate(-8 26)" fill="#6d7a62" fill-opacity=".22" filter="url(#b4)"/>
    <g clip-path="url(#gate)">
      <rect x="120" y="30" width="160" height="210" fill="url(#garden)"/>
      <rect x="158" y="30" width="11" height="210" fill="url(#bam)"/>
      <rect x="188" y="30" width="15" height="210" fill="url(#bam)"/>
      <rect x="224" y="30" width="10" height="210" fill="url(#bam)" fill-opacity=".8"/>
      <g fill="#cfe8c4" fill-opacity=".7">
        <rect x="158" y="88" width="11" height="2.5"/><rect x="158" y="152" width="11" height="2.5"/>
        <rect x="188" y="112" width="15" height="2.5"/><rect x="188" y="178" width="15" height="2.5"/>
        <rect x="224" y="96" width="10" height="2.5"/><rect x="224" y="164" width="10" height="2.5"/>
      </g>
      <path d="M126 240C130 214 148 202 164 206C176 188 200 196 204 218C212 222 216 236 212 244Z" fill="#9aa39f"/>
      <path d="M132 132A96 96 0 0 1 226 36A104 96 0 0 0 122 132A104 96 0 0 0 226 228A96 96 0 0 1 132 132Z" fill="url(#depth)"/>
    </g>
    <circle cx="226" cy="132" r="97.5" fill="none" stroke="#b7afa1" stroke-width="3"/>
    <use href="#leaves" fill="#2f6b38"/>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
