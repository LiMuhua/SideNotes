<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 169 白天探头（00 + 21 的变体）：探头的便签搬到白天的天空里，更轻快。 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb4ef"/><stop offset="1" stop-color="#2e7fcf"/></linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe36e"/><stop offset="1" stop-color="#ffc53a"/></linearGradient>
    <linearGradient id="fold" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8d6"/><stop offset="1" stop-color="#f1c24a"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".7"/></filter>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <path d="M8 46.6a3.2 3.2 0 0 1 4.6-3.4a4.6 4.6 0 0 1 8.6 1.2a3 3 0 0 1 .6 5.9H9.4a2.4 2.4 0 0 1-1.4-3.7z" fill="#fff" opacity=".85"/>
  <path d="M20 17.8a2.2 2.2 0 0 1 3.2-2.3a3.2 3.2 0 0 1 6 .8a2 2 0 0 1 .4 4H21a1.6 1.6 0 0 1-1-2.5z" fill="#fff" opacity=".6"/>
  <g clip-path="url(#c)">
    <g transform="translate(56 37) rotate(-15)">
      <path d="M-14 -14H18.5V19H-8.5L-15.5 12z" fill="#1d5ea8" opacity=".35" filter="url(#soft)"/>
      <path d="M-13.5 -17H13.5A3.5 3.5 0 0 1 17 -13.5V13.5A3.5 3.5 0 0 1 13.5 17H-10L-17 10V-13.5A3.5 3.5 0 0 1 -13.5 -17z" fill="url(#note)"/>
      <path d="M-17 10L-10 17V10z" fill="url(#fold)"/>
      <g fill="#ff8f5e" opacity=".5" filter="url(#soft2)"><ellipse cx="-12.6" cy="2.2" rx="2.3" ry="1.3"/><ellipse cx="0.4" cy="2.2" rx="2.3" ry="1.3"/></g>
      <g fill="#2b1d06"><ellipse cx="-10" cy="-3.5" rx="3" ry="3.9"/><ellipse cx="-1.2" cy="-3.5" rx="3" ry="3.9"/></g>
      <g fill="#fff"><circle cx="-11" cy="-5" r="1.15"/><circle cx="-2.2" cy="-5" r="1.15"/></g>
    </g>
  </g>
</svg>
