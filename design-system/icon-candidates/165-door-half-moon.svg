<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 165 门缝半月（15 + 21）：门缝那一线光刚好照亮便签的一半，另一半安静地留在暗处。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2521"/><stop offset="1" stop-color="#16110e"/></linearGradient>
    <linearGradient id="beam" x1="53" y1="52" x2="26" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd590" stop-opacity=".7"/><stop offset="1" stop-color="#ffd590" stop-opacity="0"/></linearGradient>
    <mask id="m"><rect x="10" y="17" width="32" height="32" rx="9" fill="#fff"/><rect x="-6" y="10" width="32" height="46" rx="14" fill="#000"/></mask>
    <filter id="glow" x="-300%" y="-20%" width="700%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <path d="M51.6 52H54.4L46 64H18Z" fill="url(#beam)"/>
    <rect x="10" y="17" width="32" height="32" rx="9" fill="#ffe3a3" opacity=".2"/>
    <g filter="url(#glow2)"><rect x="10" y="17" width="32" height="32" rx="9" fill="#ffe3a3" mask="url(#m)"/></g>
    <rect x="51.6" y="10" width="2.8" height="42" rx="1" fill="#ffe2a8" filter="url(#glow)"/>
  </g>
</svg>
