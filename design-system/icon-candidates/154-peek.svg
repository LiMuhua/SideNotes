<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 154 边边：住在屏幕边上的小家伙，探出半个脑袋看你在忙什么。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7d74"/>
      <stop offset="1" stop-color="#1a514d"/>
    </linearGradient>
    <radialGradient id="lift" cx=".25" cy=".15" r=".9">
      <stop offset="0" stop-color="#4aa093" stop-opacity=".7"/>
      <stop offset="1" stop-color="#4aa093" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx=".32" cy=".26" r=".85">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".38" stop-color="#fff5e4"/>
      <stop offset=".78" stop-color="#f5dcb9"/>
      <stop offset="1" stop-color="#e2bd90"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
    <filter id="b7" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
    <path id="head" d="M244 74C302 74 336 114 336 158C336 206 298 242 244 242C190 242 152 208 152 158C152 114 188 74 244 74Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#lift)"/>
    <g transform="rotate(-9 250 156)">
      <use href="#head" fill="#0b302d" fill-opacity=".4" filter="url(#b7)" transform="translate(-8 10)"/>
      <use href="#head" fill="url(#body)"/>
      <ellipse cx="183" cy="168" rx="11" ry="6.5" fill="#ff9c84" fill-opacity=".55" filter="url(#b2)"/>
      <ellipse cx="240" cy="168" rx="11" ry="6.5" fill="#ff9c84" fill-opacity=".45" filter="url(#b2)"/>
      <ellipse cx="193" cy="146" rx="9" ry="11.5" fill="#2a201b"/>
      <ellipse cx="231" cy="146" rx="9" ry="11.5" fill="#2a201b"/>
      <circle cx="190" cy="141" r="3.4" fill="#fff"/>
      <circle cx="228" cy="141" r="3.4" fill="#fff"/>
      <path d="M206 164Q212 170 218 164" fill="none" stroke="#2a201b" stroke-width="3.2" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
