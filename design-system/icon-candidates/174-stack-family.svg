<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 174 一叠探头 · 一家（168 + 166）：后面那张也从前一张身后探出眼睛。 -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5ac2"/><stop offset="1" stop-color="#20286a"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff07e"/><stop offset=".6" stop-color="#ffd54a"/><stop offset="1" stop-color="#ffbf33"/></linearGradient>
    <linearGradient id="fold" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe2"/><stop offset="1" stop-color="#efbf45"/></linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="-1" dy="1.4" stdDeviation="1.3" flood-color="#0b0f33" flood-opacity=".55"/></filter>
    <filter id="blush" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".6"/></filter>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#screen)"/>
  <rect width="64" height="64" rx="14" fill="url(#sheen)"/>
  <g fill="#fff" opacity=".16">
    <rect x="9" y="20" width="11" height="3.6" rx="1.8"/>
    <rect x="9" y="28.5" width="20" height="3.6" rx="1.8"/>
    <rect x="9" y="37" width="15" height="3.6" rx="1.8"/>
  </g>
  <g clip-path="url(#c)">
    <g transform="translate(64 21) rotate(10)"><rect x="-17" y="-17" width="34" height="34" rx="3.5" fill="#9fe3c5" filter="url(#sh)"/></g>
    <g transform="translate(60 29) rotate(-4)">
      <rect x="-17" y="-17" width="34" height="34" rx="3.5" fill="#fffaf0" filter="url(#sh)"/>
      <g fill="#2b1d06"><ellipse cx="-13.6" cy="-12.8" rx="2.3" ry="2.9"/><ellipse cx="-7.6" cy="-13" rx="2.3" ry="2.9"/></g>
      <g fill="#fff"><circle cx="-14.5" cy="-14" r=".9"/><circle cx="-8.5" cy="-14.2" r=".9"/></g>
    </g>
    <g transform="translate(56 37) rotate(-15)">
      <path d="M-13.5 -17H13.5A3.5 3.5 0 0 1 17 -13.5V13.5A3.5 3.5 0 0 1 13.5 17H-10L-17 10V-13.5A3.5 3.5 0 0 1 -13.5 -17z" fill="url(#note)" filter="url(#sh)"/>
      <path d="M-17 10L-10 17V10z" fill="url(#fold)"/>
      <path d="M-13.5 -17H13.5" stroke="#fff" stroke-opacity=".6" stroke-width=".8"/>
      <g fill="#ff8f5e" opacity=".5" filter="url(#blush)"><ellipse cx="-12.6" cy="2.2" rx="2.3" ry="1.3"/><ellipse cx="0.4" cy="2.2" rx="2.3" ry="1.3"/></g>
      <g fill="#2b1d06"><ellipse cx="-10" cy="-3.5" rx="3.1" ry="4"/><ellipse cx="-1.2" cy="-3.5" rx="3.1" ry="4"/></g>
      <g fill="#fff"><circle cx="-11" cy="-5" r="1.2"/><circle cx="-2.2" cy="-5" r="1.2"/><circle cx="-9" cy="-1.9" r=".5"/><circle cx="-.2" cy="-1.9" r=".5"/></g>
      <path d="M-7.4 3.6Q-5.6 5.4 -3.8 3.6" fill="none" stroke="#2b1d06" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </g>
</svg>
