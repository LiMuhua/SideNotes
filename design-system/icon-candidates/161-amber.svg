    </g>
    <path d="M86 112C98 94 120 82 142 74" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" filter="url(#b3)"/>
    <ellipse cx="96" cy="104" rx="9" ry="4" transform="rotate(-40 96 104)" fill="#fff" fill-opacity=".92"/>
    <ellipse cx="190" cy="64" rx="5" ry="2.5" transform="rotate(-50 190 64)" fill="#fff" fill-opacity=".85"/>
    <path d="M206 112C204 146 186 182 156 202" fill="none" stroke="#ffe9b0" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round" filter="url(#b1)"/>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>
